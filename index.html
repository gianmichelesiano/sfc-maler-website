<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFC Maler GmbH – Salvo Catanese</title>
  <meta name="description" content="Ihr Malerprofi in der ganzen Schweiz. SFC Maler GmbH von Salvo Catanese – Qualität, Präzision und Sauberkeit." />

  <!-- SEO -->
  <meta name="keywords" content="Maler Schweiz, Malerarbeiten Freienbach, Maler Kanton Schwyz, Spritzlackierung, Gipsarbeiten, pittore Svizzera, SFC Maler, Salvo Catanese" />
  <meta name="author" content="SFC Maler GmbH – Salvo Catanese" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (social sharing) -->
  <meta property="og:title" content="SFC Maler GmbH – Ihr Malerprofi in der ganzen Schweiz" />
  <meta property="og:description" content="Professionelle Malerarbeiten in der ganzen Schweiz. Innen, Aussen, Spritzlackierung. Qualität und Sauberkeit garantiert." />
  <meta property="og:image" content="assets/images/hero.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="de_CH" />
  <meta property="og:locale:alternate" content="it_CH" />

  <!-- Favicon emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:      '#1E3EAF',
            'primary-dark': '#162E8A',
            accent:       '#F5A623',
            'accent-dark': '#D98B0E',
            dark:         '#1A1A2E',
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css" />

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body
  class="font-sans text-dark bg-white"
  x-data="sfcApp()"
  x-init="init()"
>

  <!-- HEADER -->
<header
  class="fixed top-0 left-0 right-0 z-50 bg-white transition-shadow duration-300"
  :class="{ 'shadow-md': scrolled }"
>
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

    <!-- Logo -->
    <a href="#" @click.prevent="scrollTo('hero')">
      <img src="assets/logo_nero.jpeg" alt="SFC Maler GmbH Logo" class="h-14 w-auto" />
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-dark">
      <a href="#" @click.prevent="scrollTo('services')" class="hover:text-primary transition-colors" x-text="t('nav_services')"></a>
      <a href="#" @click.prevent="scrollTo('about')"    class="hover:text-primary transition-colors" x-text="t('nav_about')"></a>
      <a href="#" @click.prevent="scrollTo('gallery')"  class="hover:text-primary transition-colors" x-text="t('nav_gallery')"></a>
      <a href="#" @click.prevent="scrollTo('contact')"  class="hover:text-primary transition-colors" x-text="t('nav_contact')"></a>
    </nav>

    <!-- Right: Lang Toggle + CTA -->
    <div class="hidden md:flex items-center gap-3">
      <button
        @click="toggleLang()"
        class="text-xs font-bold border-2 border-primary text-primary rounded-full px-3 py-1 hover:bg-primary hover:text-white transition-all"
        x-text="lang === 'de' ? '🇮🇹 IT' : '🇩🇪 DE'"
      ></button>
      <a
        href="tel:0784044747"
        class="bg-accent hover:bg-accent-dark text-dark text-sm font-bold px-4 py-2 transition-colors"
        x-text="t('nav_cta')"
      ></a>
    </div>

    <!-- Mobile Hamburger -->
    <button
      class="md:hidden flex flex-col gap-1.5 p-2"
      @click="menuOpen = !menuOpen"
      aria-label="Menu"
    >
      <span class="block w-6 h-0.5 bg-dark transition-all" :class="{'rotate-45 translate-y-2': menuOpen}"></span>
      <span class="block w-6 h-0.5 bg-dark transition-all" :class="{'opacity-0': menuOpen}"></span>
      <span class="block w-6 h-0.5 bg-dark transition-all" :class="{'-rotate-45 -translate-y-2': menuOpen}"></span>
    </button>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div
    x-show="menuOpen"
    x-transition
    class="md:hidden bg-white border-t border-gray-100 px-4 py-4 flex flex-col gap-4 text-sm font-semibold"
  >
    <a href="#" @click.prevent="scrollTo('services')" x-text="t('nav_services')"></a>
    <a href="#" @click.prevent="scrollTo('about')"    x-text="t('nav_about')"></a>
    <a href="#" @click.prevent="scrollTo('gallery')"  x-text="t('nav_gallery')"></a>
    <a href="#" @click.prevent="scrollTo('contact')"  x-text="t('nav_contact')"></a>
    <div class="flex items-center gap-3 pt-2 border-t border-gray-100">
      <button @click="toggleLang()" class="text-xs font-bold border-2 border-primary text-primary rounded-full px-3 py-1" x-text="lang === 'de' ? '🇮🇹 IT' : '🇩🇪 DE'"></button>
      <a href="tel:0784044747" class="bg-accent hover:bg-accent-dark text-dark text-sm font-bold px-4 py-2 transition-colors" x-text="t('nav_cta')"></a>
    </div>
  </div>
</header>

  <!-- HERO -->
<section id="hero" class="flex flex-col md:flex-row min-h-screen">

  <!-- Sinistra: blu -->
  <div class="w-full md:w-1/2 bg-primary flex items-center py-28 px-8 md:px-14 lg:px-20">
    <div class="w-full">
      <!-- Sottotitolo -->
      <p class="text-accent font-bold uppercase tracking-widest text-sm mb-4"
         x-text="t('hero_subtitle')"></p>
      <!-- Titolo bold -->
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-white leading-tight"
          x-text="t('hero_title')"></h1>
      <!-- CTA buttons -->
      <div class="mt-10 flex flex-wrap gap-4">
        <a href="#"
           @click.prevent="scrollTo('contact')"
           class="bg-accent hover:bg-accent-dark text-dark font-bold px-8 py-3 transition-colors text-sm"
           x-text="t('hero_cta')"></a>
        <a href="tel:0784044747"
           class="border-2 border-white text-white font-bold px-8 py-3 hover:bg-white hover:text-primary transition-colors text-sm"
           x-text="t('hero_cta2')"></a>
      </div>
      <!-- Stats circles -->
      <div class="mt-14 flex gap-5 flex-wrap">
        <div class="border-2 border-white/25 rounded-full w-[90px] h-[90px] flex flex-col items-center justify-center">
          <span class="text-xl font-bold text-white" x-text="t('hero_stat1_num')"></span>
          <span class="text-[10px] text-white/60 text-center leading-tight px-1" x-text="t('hero_stat1_lbl')"></span>
        </div>
        <div class="border-2 border-white/25 rounded-full w-[90px] h-[90px] flex flex-col items-center justify-center">
          <span class="text-xl font-bold text-white" x-text="t('hero_stat2_num')"></span>
          <span class="text-[10px] text-white/60 text-center leading-tight px-1" x-text="t('hero_stat2_lbl')"></span>
        </div>
        <div class="border-2 border-white/25 rounded-full w-[90px] h-[90px] flex flex-col items-center justify-center">
          <span class="text-xl font-bold text-white" x-text="t('hero_stat3_num')"></span>
          <span class="text-[10px] text-white/60 text-center leading-tight px-1" x-text="t('hero_stat3_lbl')"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Destra: immagine -->
  <div class="w-full md:w-1/2 min-h-[50vh] md:min-h-screen relative">
    <img
      src="assets/images/hero.jpg"
      alt="SFC Maler – Professionelle Malerarbeiten"
      class="absolute inset-0 w-full h-full object-cover"
    />
  </div>

</section>

  <!-- SERVICES -->
<section id="services" class="py-20 bg-gray-50">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-14">
      <p class="text-accent font-bold uppercase tracking-widest text-sm mb-2" x-text="t('services_label')"></p>
      <h2
        class="text-3xl md:text-4xl font-bold text-dark"
        x-text="t('services_title')"
      ></h2>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Pittura interni/esterni: pennello -->
      <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-all text-center group border-b-4 border-transparent hover:border-accent">
        <div class="flex justify-center mb-4">
          <div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center group-hover:bg-accent/10 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-primary group-hover:text-accent transition-colors">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.146 6.32a15.996 15.996 0 0 0-4.649 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42" />
            </svg>
          </div>
        </div>
        <h3 class="text-lg font-bold text-dark mb-2 group-hover:text-primary transition-colors" x-text="t('svc1_title')"></h3>
        <p class="text-sm text-gray-500 leading-relaxed" x-text="t('svc1_desc')"></p>
      </div>
      <!-- Spritzlackierung: fulmine/precisione -->
      <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-all text-center group border-b-4 border-transparent hover:border-accent">
        <div class="flex justify-center mb-4">
          <div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center group-hover:bg-accent/10 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-primary group-hover:text-accent transition-colors">
              <path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
            </svg>
          </div>
        </div>
        <h3 class="text-lg font-bold text-dark mb-2 group-hover:text-primary transition-colors" x-text="t('svc2_title')"></h3>
        <p class="text-sm text-gray-500 leading-relaxed" x-text="t('svc2_desc')"></p>
      </div>
      <!-- Gipsarbeiten: livelli/strati -->
      <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-all text-center group border-b-4 border-transparent hover:border-accent">
        <div class="flex justify-center mb-4">
          <div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center group-hover:bg-accent/10 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-primary group-hover:text-accent transition-colors">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.429 9.75 2.25 12l4.179 2.25m0-4.5 5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0 4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0-5.571 3-5.571-3" />
            </svg>
          </div>
        </div>
        <h3 class="text-lg font-bold text-dark mb-2 group-hover:text-primary transition-colors" x-text="t('svc3_title')"></h3>
        <p class="text-sm text-gray-500 leading-relaxed" x-text="t('svc3_desc')"></p>
      </div>
      <!-- Dekorative Behandlungen: scintille/stelle -->
      <div class="bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition-all text-center group border-b-4 border-transparent hover:border-accent">
        <div class="flex justify-center mb-4">
          <div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center group-hover:bg-accent/10 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-primary group-hover:text-accent transition-colors">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
            </svg>
          </div>
        </div>
        <h3 class="text-lg font-bold text-dark mb-2 group-hover:text-primary transition-colors" x-text="t('svc4_title')"></h3>
        <p class="text-sm text-gray-500 leading-relaxed" x-text="t('svc4_desc')"></p>
      </div>
    </div>
  </div>
</section>

  <!-- STATS BAR -->
<section class="py-16 bg-primary">
  <div class="max-w-6xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-10 text-center">
    <div>
      <p class="text-5xl font-extrabold text-white">34</p>
      <p class="text-sm text-white/60 mt-2 uppercase tracking-wider" x-text="t('stats_projects')"></p>
    </div>
    <div class="border-l border-white/15 pl-6 sm:pl-0 sm:border-0">
      <p class="text-5xl font-extrabold text-white">15+</p>
      <p class="text-sm text-white/60 mt-2 uppercase tracking-wider" x-text="t('stats_experience')"></p>
    </div>
    <div class="border-l border-white/15 pl-6 sm:pl-0 sm:border-0">
      <p class="text-5xl font-extrabold text-white">5</p>
      <p class="text-sm text-white/60 mt-2 uppercase tracking-wider" x-text="t('stats_team')"></p>
    </div>
    <div class="border-l border-white/15 pl-6 sm:pl-0 sm:border-0">
      <p class="text-5xl font-extrabold text-white">100+</p>
      <p class="text-sm text-white/60 mt-2 uppercase tracking-wider" x-text="t('stats_clients')"></p>
    </div>
  </div>
</section>

  <!-- ABOUT -->
<section id="about" class="py-20 bg-white">
  <div class="max-w-6xl mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
      <div>
        <p class="text-accent font-bold uppercase tracking-widest text-sm mb-2" x-text="t('about_label')"></p>
        <h2
          class="text-3xl md:text-4xl font-bold text-dark mb-6"
          x-text="t('about_title')"
        ></h2>
        <p
          class="text-gray-600 leading-relaxed text-lg mb-8"
          x-text="t('about_text')"
        ></p>
        <div class="flex flex-col gap-3">
          <span class="inline-flex items-center text-base font-semibold text-dark border-l-4 border-accent pl-3" x-text="t('about_badge1')"></span>
          <span class="inline-flex items-center text-base font-semibold text-dark border-l-4 border-accent pl-3" x-text="t('about_badge2')"></span>
          <span class="inline-flex items-center text-base font-semibold text-dark border-l-4 border-accent pl-3" x-text="t('about_badge3')"></span>
        </div>
      </div>
      <div class="rounded-2xl overflow-hidden shadow-xl">
        <img
          src="assets/images/about.jpg"
          alt="SFC Maler – Salvo Catanese al lavoro"
          class="w-full h-80 object-cover"
        />
      </div>
    </div>
  </div>
</section>

  <!-- GALLERY -->
<section id="gallery" class="py-20 bg-gray-50">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-14">
      <p class="text-accent font-bold uppercase tracking-widest text-sm mb-2" x-text="t('gallery_title')"></p>
      <h2 class="text-3xl md:text-4xl font-bold text-dark" x-text="t('gallery_title')"></h2>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="overflow-hidden rounded-2xl shadow-md hover:shadow-xl transition-shadow group">
        <img src="assets/images/gallery-1.jpg" alt="Malerarbeiten 1" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500" />
      </div>
      <div class="overflow-hidden rounded-2xl shadow-md hover:shadow-xl transition-shadow group">
        <img src="assets/images/gallery-2.jpg" alt="Malerarbeiten 2" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500" />
      </div>
      <div class="overflow-hidden rounded-2xl shadow-md hover:shadow-xl transition-shadow group">
        <img src="assets/images/gallery-3.jpg" alt="Malerarbeiten 3" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500" />
      </div>
      <div class="overflow-hidden rounded-2xl shadow-md hover:shadow-xl transition-shadow group">
        <img src="assets/images/gallery-4.jpg" alt="Malerarbeiten 4" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500" />
      </div>
      <div class="overflow-hidden rounded-2xl shadow-md hover:shadow-xl transition-shadow group">
        <img src="assets/images/gallery-5.jpg" alt="Malerarbeiten 5" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500" />
      </div>
      <div class="overflow-hidden rounded-2xl shadow-md hover:shadow-xl transition-shadow group">
        <img src="assets/images/gallery-6.jpg" alt="Malerarbeiten 6" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500" />
      </div>
    </div>
  </div>
</section>

  <!-- CONTACT -->
<section id="contact" class="py-20 bg-white">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-14">
      <p class="text-accent font-bold uppercase tracking-widest text-sm mb-2" x-text="t('contact_title')"></p>
      <h2 class="text-3xl md:text-4xl font-bold text-dark" x-text="t('contact_title')"></h2>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">
      <!-- Form -->
      <form
        name="contact"
        class="flex flex-col gap-4"
        @submit.prevent="handleSubmit($event)"
      >
        <input
          type="text"
          name="name"
          required
          :placeholder="t('form_name')"
          class="border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
        />
        <input
          type="email"
          name="email"
          required
          :placeholder="t('form_email')"
          class="border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
        />
        <input
          type="tel"
          name="phone"
          :placeholder="t('form_phone')"
          class="border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
        />
        <textarea
          name="message"
          rows="5"
          required
          :placeholder="t('form_message')"
          class="border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-accent resize-none w-full"
        ></textarea>
        <button
          type="submit"
          class="bg-accent hover:bg-accent-dark text-dark font-bold py-3 transition-colors"
          x-text="t('form_submit')"
        ></button>
        <p
          x-show="formSuccess"
          x-transition
          class="text-accent font-semibold text-center"
          x-text="t('form_success')"
        ></p>
      </form>

      <!-- Info + Map -->
      <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-3 text-gray-700">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center bg-primary/10 rounded-full shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
              </svg>
            </div>
            <div>
              <p class="text-xs text-gray-400 uppercase font-semibold" x-text="t('address_label')"></p>
              <p class="font-semibold">8807 Freienbach, Schweiz</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
